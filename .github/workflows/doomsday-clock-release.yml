name: Doomsday Clock journal download

# Publishes the sideloadable journal APK to a GitHub Release.
# Tag: doomsday-v3.0.0 (does not match the Polybius v* workflow).
on:
  push:
    tags:
      - 'doomsday-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'doomsday-v3.0.0' }}
          name: Doomsday Clock journal 3.0.0
          draft: false
          prerelease: false
          generate_release_notes: false
          files: doomsday_clock/releases/doomsday-clock-journal-3.0.0-android-arm64.apk
          body: |
            Sideloadable Android **arm64-v8a** APK for DOØMSDAY CLØCK (local calendar / journal). No server, no AI backend.

            **Download:** `doomsday-clock-journal-3.0.0-android-arm64.apk`
            **Package:** `com.polybius.doomsday_clock`
            **Version:** 3.0.0
            **SHA-256:** `ef3c127b7b75cd61912a01bf7ee09107bb00b01c8c3ed7bda496aaa107461700`

            Install: enable unknown sources → open the APK → launch **Doomsday Clock**.
            Camera is optional (QR scan). Paste still works without a camera.

            Debug-signed for sideload (same as the PØLYBĪUS BETA APK).
