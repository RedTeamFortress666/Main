name: Build Polybius downloads

# Produces downloadable PØLYBĪUS builds. Run manually (Actions -> this workflow
# -> Run workflow) to get artifacts, or push a tag like `v1.0.0-beta.1` to also
# publish a GitHub Release with the files attached.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  WORKING_DIR: polybius

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build web --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package web build
        run: |
          cd ${{ env.WORKING_DIR }}/build/web
          zip -r "$GITHUB_WORKSPACE/polybius-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-web
          path: polybius-web.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      # V1 Stable: HQ (EMOJINIGMA) + everyday User APKs.
      - name: Build HQ (EMOJINIGMA) APK
        run: |
          flutter build apk --release --flavor hq \
            --dart-define=POLYBIUS_FLAVOR=hq
        working-directory: ${{ env.WORKING_DIR }}
      - name: Build User APK
        run: |
          flutter build apk --release --flavor user \
            --dart-define=POLYBIUS_FLAVOR=user
        working-directory: ${{ env.WORKING_DIR }}
      - name: Stage V1 Stable APKs
        run: |
          HQ="${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-hq-release.apk"
          USER="${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-user-release.apk"
          mkdir -p "${{ env.WORKING_DIR }}/dist"
          cp "$HQ" "${{ env.WORKING_DIR }}/dist/POLYBIUS-V1-STABLE-hq-emojinigma-android-arm64.apk"
          cp "$USER" "${{ env.WORKING_DIR }}/dist/POLYBIUS-V1-STABLE-user-android-arm64.apk"
          # Convenience aliases (ASCII-safe filenames for raw GitHub links).
          cp "$HQ" "${{ env.WORKING_DIR }}/dist/polybius-v1-stable-hq-android-arm64.apk"
          cp "$USER" "${{ env.WORKING_DIR }}/dist/polybius-v1-stable-user-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-android-apk-hq
          path: ${{ env.WORKING_DIR }}/dist/polybius-v1-stable-hq-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-android-apk-user
          path: ${{ env.WORKING_DIR }}/dist/polybius-v1-stable-user-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-android-apk
          path: |
            ${{ env.WORKING_DIR }}/dist/polybius-v1-stable-hq-android-arm64.apk
            ${{ env.WORKING_DIR }}/dist/polybius-v1-stable-user-android-arm64.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build linux --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package Linux build
        run: |
          cd ${{ env.WORKING_DIR }}/build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/polybius-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-linux-x64
          path: polybius-linux-x64.tar.gz

  # aarch64 Linux build for ARM handhelds (R36 S / R36 Ultra run ARM Linux).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build linux --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package aarch64 Linux build (+ R36 launch script)
        run: |
          cd ${{ env.WORKING_DIR }}/build/linux/arm64/release/bundle
          cp "$GITHUB_WORKSPACE/${{ env.WORKING_DIR }}/packaging/r36/polybius.sh" . || true
          tar -czf "$GITHUB_WORKSPACE/polybius-linux-arm64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-linux-arm64
          path: polybius-linux-arm64.tar.gz

  # iOS build (unsigned). A distributable IPA requires an Apple signing
  # identity; add code signing to produce a side-loadable/App Store build.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build ios --release --no-codesign
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package unsigned .ipa (Payload/Runner.app)
        run: |
          cd ${{ env.WORKING_DIR }}/build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/
          # A .ipa is just a zip with a top-level Payload/ dir; this layout is
          # what AltStore / Sideloadly / TrollStore expect. It is UNSIGNED —
          # sideload with your own Apple ID, or sign for TestFlight/App Store.
          zip -r "$GITHUB_WORKSPACE/polybius-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-ios-unsigned
          path: polybius-ios-unsigned.ipa

  release:
    needs: [web, android, linux, linux-arm64, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
