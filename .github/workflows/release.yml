name: Build Polybius downloads

# Produces downloadable PØLYBĪUS builds. Run manually (Actions -> this workflow
# -> Run workflow) to get artifacts, or push a tag like `v1.0.0-beta.1` to also
# publish a GitHub Release with the files attached.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  WORKING_DIR: polybius

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build web --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package web build
        run: |
          cd ${{ env.WORKING_DIR }}/build/web
          zip -r "$GITHUB_WORKSPACE/polybius-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-web
          path: polybius-web.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      # Builds a release APK. Without android/key.properties this is debug-signed
      # (fine for BETA side-loading); add a keystore for distribution signing.
      - run: flutter build apk --release
        working-directory: ${{ env.WORKING_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-android-apk
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-release.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build linux --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package Linux build
        run: |
          cd ${{ env.WORKING_DIR }}/build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/polybius-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-linux-x64
          path: polybius-linux-x64.tar.gz

  release:
    needs: [web, android, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
