name: Build Polybius downloads

# Produces downloadable PØLYBĪUS builds. Run manually (Actions -> this workflow
# -> Run workflow) to get artifacts, or push a tag like `v1.0.0-beta.1` to also
# publish a GitHub Release with the files attached.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.8
  WORKING_DIR: polybius

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build web --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package web build
        run: |
          cd ${{ env.WORKING_DIR }}/build/web
          zip -r "$GITHUB_WORKSPACE/polybius-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-web
          path: polybius-web.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      # Builds a release APK. Without android/key.properties this is debug-signed
      # (fine for BETA side-loading); add a keystore for distribution signing.
      - run: flutter build apk --release
        working-directory: ${{ env.WORKING_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-android-apk
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-release.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config \
            libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build linux --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package Linux build
        run: |
          cd ${{ env.WORKING_DIR }}/build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/polybius-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-linux-x64
          path: polybius-linux-x64.tar.gz

  # aarch64 Linux build for ARM handhelds (R36 S / R36 Ultra run ARM Linux).
  # flutter-action cannot resolve stable/arm64 from the Flutter archive JSON,
  # so the SDK is cloned from the 3.44.8 tag instead.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter from git
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config \
            libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            libsecret-1-dev libjsoncpp-dev
      - run: flutter config --no-analytics
      - run: flutter doctor -v
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build linux --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package aarch64 Linux build (+ R36 launch script)
        run: |
          cd ${{ env.WORKING_DIR }}/build/linux/arm64/release/bundle
          cp "$GITHUB_WORKSPACE/${{ env.WORKING_DIR }}/packaging/r36/polybius.sh" . || true
          tar -czf "$GITHUB_WORKSPACE/polybius-linux-arm64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-linux-arm64
          path: polybius-linux-arm64.tar.gz

  # iOS build (unsigned). A distributable IPA requires an Apple signing
  # identity; add code signing to produce a side-loadable/App Store build.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build ios --release --no-codesign
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package unsigned .app
        run: |
          cd ${{ env.WORKING_DIR }}/build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/polybius-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-ios-unsigned
          path: polybius-ios-unsigned.zip

  release:
    needs: [web, android, linux, linux-arm64, ios]
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      !cancelled() &&
      needs.web.result == 'success' &&
      needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
