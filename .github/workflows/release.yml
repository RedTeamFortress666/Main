name: Build Polybius downloads

# Produces downloadable PØLYBĪUS builds. Run manually (Actions -> this workflow
# -> Run workflow) or push a tag like `v1.0.0-beta.1`. Artifacts stay on the
# run for the operator; shareable links are minted on temp.sh (t3mp), not as a
# GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  WORKING_DIR: polybius

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build web --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package web build
        run: |
          cd ${{ env.WORKING_DIR }}/build/web
          zip -r "$GITHUB_WORKSPACE/polybius-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-web
          path: polybius-web.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      # Builds a release APK. Without android/key.properties this is debug-signed
      # (fine for BETA side-loading); add a keystore for distribution signing.
      - run: flutter build apk --release
        working-directory: ${{ env.WORKING_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-android-apk
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-release.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build linux --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package Linux build
        run: |
          cd ${{ env.WORKING_DIR }}/build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/polybius-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-linux-x64
          path: polybius-linux-x64.tar.gz

  # aarch64 Linux build for ARM handhelds (R36 S / R36 Ultra run ARM Linux).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build linux --release
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package aarch64 Linux build (+ R36 launch script)
        run: |
          cd ${{ env.WORKING_DIR }}/build/linux/arm64/release/bundle
          cp "$GITHUB_WORKSPACE/${{ env.WORKING_DIR }}/packaging/r36/polybius.sh" . || true
          tar -czf "$GITHUB_WORKSPACE/polybius-linux-arm64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-linux-arm64
          path: polybius-linux-arm64.tar.gz

  # iOS build (unsigned). A distributable IPA requires an Apple signing
  # identity; add code signing to produce a side-loadable/App Store build.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
      - run: flutter build ios --release --no-codesign
        working-directory: ${{ env.WORKING_DIR }}
      - name: Package unsigned .app
        run: |
          cd ${{ env.WORKING_DIR }}/build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/polybius-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: polybius-ios-unsigned
          path: polybius-ios-unsigned.zip

  t3mp:
    needs: [web, android, linux, linux-arm64, ios]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Mint t3mp drops (not GitHub Releases)
        run: |
          set -euo pipefail
          {
            echo "## PØLYBĪUS t3mp links"
            echo
            echo "Anonymous [temp.sh](https://temp.sh) drops — **not** GitHub Releases or raw GitHub URLs."
            echo "Files expire after **3 days**. Open the page, then **Click here to download**."
            echo "Direct: \`curl -X POST -O -J <url>\`"
            echo
            echo "| Artifact | t3mp URL |"
            echo "| --- | --- |"
            found=0
            while IFS= read -r -d '' file; do
              found=1
              url=$(curl -sS -F "file=@${file}" https://temp.sh/upload | tr -d '\r')
              url="${url%%$'\n'*}"
              name=$(basename "$file")
              echo "| \`$name\` | $url |"
            done < <(find artifacts -type f -print0)
            if [[ "$found" -eq 0 ]]; then
              echo "| _none_ | build jobs produced no files |"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
