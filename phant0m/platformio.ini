; Phant0m F1rmwar3 — ESP32 CYD (ESP32-2432S028R)
; Arduino framework, size-first builds for off-grid solar field use.
;
; Flash budget: field `solar` image MUST be < 256 KiB (scripts/size_check.py).
; Espressif's closed WiFi/BT blobs alone exceed that ceiling, so the default
; solar image keeps PQC/TinyML/MQTT/power on-chip and bridges radio via UART.
; Use `wifi` / `ble` envs when linking native stacks (lab / larger flash OK).

[platformio]
default_envs = solar
src_dir = src
include_dir = include

[common]
build_flags =
  -Os
  -ffunction-sections
  -fdata-sections
  -fno-exceptions
  -fno-rtti
  -fno-threadsafe-statics
  -DCORE_DEBUG_LEVEL=0
  -DPHANT0M_VERSION=\"0.1.0\"
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCONFIG_NEWLIB_NANO_FORMAT=y
  -Wl,--gc-sections

[env]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_phant0m.csv
board_build.f_cpu = 80000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
build_unflags =
  -O2
  -std=gnu++11
build_flags =
  ${common.build_flags}
  -std=gnu++17
extra_scripts =
  pre:scripts/size_budget.py
  pre:scripts/force_nano_libc.py
  post:scripts/size_check.py

; Default field image — STRICT < 256 KiB.
; Kyber512 + solar RNG + TinyML + MQTT/QKD framing + UART radio bridge + PM.
[env:solar]
build_flags =
  ${env.build_flags}
  -DPHANT0M_MODE_SOLAR=1
  -DPHANT0M_ENABLE_WIFI=0
  -DPHANT0M_ENABLE_BLE=0
  -DPHANT0M_ENABLE_DISPLAY=0
  -DPHANT0M_ENABLE_MQTT=1
  -DPHANT0M_ENABLE_TINYML=1
  -DPHANT0M_STRICT_SIZE=1

; Native WiFi softAP beacon + scan TinyML + MQTT (lab; >256 KiB).
[env:wifi]
lib_deps =
  knolleary/PubSubClient @ ^2.8
build_flags =
  ${env.build_flags}
  -DPHANT0M_MODE_SOLAR=1
  -DPHANT0M_ENABLE_WIFI=1
  -DPHANT0M_ENABLE_BLE=0
  -DPHANT0M_ENABLE_DISPLAY=0
  -DPHANT0M_ENABLE_MQTT=1
  -DPHANT0M_ENABLE_TINYML=1
  -DPHANT0M_STRICT_SIZE=0
board_build.f_cpu = 160000000L

; Native NimBLE advertiser (lab; >256 KiB).
[env:ble]
lib_deps =
  h2zero/NimBLE-Arduino @ ^1.4.3
build_flags =
  ${env.build_flags}
  -DPHANT0M_MODE_SOLAR=1
  -DPHANT0M_ENABLE_WIFI=0
  -DPHANT0M_ENABLE_BLE=1
  -DPHANT0M_ENABLE_DISPLAY=0
  -DPHANT0M_ENABLE_MQTT=0
  -DPHANT0M_ENABLE_TINYML=0
  -DPHANT0M_STRICT_SIZE=0
board_build.f_cpu = 160000000L

; Full lab debug.
[env:lab]
lib_deps =
  knolleary/PubSubClient @ ^2.8
  h2zero/NimBLE-Arduino @ ^1.4.3
build_flags =
  ${env.build_flags}
  -DPHANT0M_MODE_SOLAR=0
  -DPHANT0M_ENABLE_WIFI=1
  -DPHANT0M_ENABLE_BLE=1
  -DPHANT0M_ENABLE_DISPLAY=1
  -DPHANT0M_ENABLE_MQTT=1
  -DPHANT0M_ENABLE_TINYML=1
  -DPHANT0M_STRICT_SIZE=0
  -DCORE_DEBUG_LEVEL=1
board_build.f_cpu = 160000000L
