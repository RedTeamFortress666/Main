<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070614" />
  <title>FACE INVADA's BEAT BOXING</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="apk-link" href="downloads.html">GET APK</a>
  <div id="wrap">
    <canvas id="game" width="1280" height="720" aria-label="FACE INVADA's BEAT BOXING">
      Canvas required.
    </canvas>
  </div>
  <div id="touch-ui" class="touch-ui show" aria-hidden="false">
    <div class="touch-cluster left">
      <div class="dpad">
        <button type="button" class="tbtn dpad-up" data-code="KeyW">UP</button>
        <button type="button" class="tbtn dpad-left" data-code="KeyA">LEFT</button>
        <button type="button" class="tbtn dpad-down" data-code="KeyS">DOWN</button>
        <button type="button" class="tbtn dpad-right" data-code="KeyD">RIGHT</button>
      </div>
    </div>
    <div class="touch-cluster right">
      <div class="touch-row">
        <button type="button" class="tbtn punch" data-code="KeyZ">PUNCH</button>
        <button type="button" class="tbtn kick" data-code="KeyX">KICK</button>
      </div>
      <div class="touch-row">
        <button type="button" class="tbtn blade" data-code="KeyC">BLADE</button>
        <button type="button" class="tbtn bass" data-code="KeyV">BASS</button>
      </div>
      <div class="touch-row">
        <button type="button" class="tbtn start" data-code="Enter">START</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
