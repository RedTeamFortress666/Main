; PØLYBĪUS firmware — LilyGO T-Deck / T-Embed(-S3) / CYD / M5 Cardputer
; Build:  pio run -e tdeck
;         pio run -e tembed
;         pio run -e cyd
;         pio run -e cardputer
; Flash:  pio run -e <env> -t upload
; Host tests (no hardware): make test

[platformio]
default_envs = tdeck
src_dir = src
include_dir = include

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
build_flags =
  -DUSER_SETUP_LOADED=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -Iinclude
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
build_unflags =
  -std=gnu++11
build_src_filter =
  +<*>
  +<cipher/>
  +<ui/>
  +<hal/>

; ---------- LilyGO T-Deck (ESP32-S3, 320x240 ST7789, keyboard) ----------
[env:tdeck]
extends = common
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${common.build_flags}
  -DBOARD_TDECK=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DUSE_HSPI_PORT=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=41
  -DTFT_SCLK=40
  -DTFT_CS=12
  -DTFT_DC=11
  -DTFT_RST=-1
  -DTFT_BL=42
  -DTFT_BACKLIGHT_ON=1
  -DTOUCH_CS=-1

; ---------- LilyGO T-Embed S3 (170x320 ST7789, rotary) ----------
[env:tembed]
extends = common
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${common.build_flags}
  -DBOARD_TEMBED=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DST7789_DRIVER=1
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=13
  -DTFT_RST=9
  -DTFT_BL=15
  -DTFT_BACKLIGHT_ON=1
  -DTOUCH_CS=-1

; ---------- CYD ESP32-2432S028 (240x320 ILI9341, resistive touch) ----------
[env:cyd]
extends = common
platform = espressif32@6.9.0
board = esp32dev
build_flags =
  ${common.build_flags}
  -DBOARD_CYD=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=1
  -DUSE_HSPI_PORT=1
  -DTOUCH_CS=33
lib_deps =
  ${common.lib_deps}
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ---------- M5Stack Cardputer (ESP32-S3 Stamp, 240x135 ST7789, matrix KB) ----------
[env:cardputer]
extends = common
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
build_flags =
  ${common.build_flags}
  -DBOARD_CARDPUTER=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DTFT_MOSI=35
  -DTFT_SCLK=36
  -DTFT_CS=37
  -DTFT_DC=34
  -DTFT_RST=33
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=1
  -DTOUCH_CS=-1
  -DCGRAM_OFFSET
